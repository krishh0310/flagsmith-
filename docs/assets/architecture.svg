<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Flag Rehearsal architecture</title><desc id="desc">Dashboard, CLI and CI share the engine. The existing environments are read through the SDK and Explorer writes only to temporary environments. Evidence feeds the Risk Map and the CLI exit determines the example check.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="context-stroke"/></marker></defs>
<rect x="1" y="1" width="1198" height="688" rx="18" fill="#0B1120" stroke="#27354A"/><text x="42" y="56" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="600">Flag Rehearsal architecture</text><text x="42" y="91" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="500">Purple moves flag configuration. Mint carries execution and evidence.</text><rect x="42" y="125" width="292" height="84" rx="12" fill="#111827" stroke="#27354A"/><rect x="55" y="143" width="4" height="21" rx="2" fill="#34D399" stroke="#34D399"/><text x="71" y="160" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">Developer</text><text x="71" y="188" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="500">Dashboard or CLI</text><rect x="454" y="125" width="292" height="84" rx="12" fill="#111827" stroke="#27354A"/><rect x="467" y="143" width="4" height="21" rx="2" fill="#34D399" stroke="#34D399"/><text x="483" y="160" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">CI pipeline</text><text x="483" y="188" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="500">Runs the CLI</text><rect x="42" y="262" width="292" height="84" rx="12" fill="#111827" stroke="#27354A"/><rect x="55" y="280" width="4" height="21" rx="2" fill="#34D399" stroke="#34D399"/><text x="71" y="297" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">Journey registry</text><text x="71" y="325" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="500">Targets and synthetic IDs</text><rect x="454" y="262" width="292" height="84" rx="12" fill="#111827" stroke="#27354A"/><rect x="467" y="280" width="4" height="21" rx="2" fill="#34D399" stroke="#34D399"/><text x="483" y="297" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">Rehearsal engine</text><text x="483" y="325" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="500">Playwright and comparison</text><rect x="866" y="125" width="292" height="84" rx="12" fill="#111827" stroke="#27354A"/><rect x="879" y="143" width="4" height="21" rx="2" fill="#8B5CF6" stroke="#8B5CF6"/><text x="895" y="160" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">Explorer</text><text x="895" y="188" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="500">Combinations and reruns</text><rect x="866" y="262" width="292" height="84" rx="12" fill="#111827" stroke="#27354A"/><rect x="879" y="280" width="4" height="21" rx="2" fill="#8B5CF6" stroke="#8B5CF6"/><text x="895" y="297" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">Self-hosted Flagsmith</text><text x="895" y="325" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="500">Current, Proposed, temporary</text><rect x="866" y="415" width="292" height="84" rx="12" fill="#111827" stroke="#27354A"/><rect x="879" y="433" width="4" height="21" rx="2" fill="#8B5CF6" stroke="#8B5CF6"/><text x="895" y="450" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">Application under test</text><text x="895" y="478" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="500">Flagsmith SDK and UI</text><rect x="454" y="415" width="292" height="84" rx="12" fill="#111827" stroke="#27354A"/><rect x="467" y="433" width="4" height="21" rx="2" fill="#34D399" stroke="#34D399"/><text x="483" y="450" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">Evidence storage</text><text x="483" y="478" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="500">Reports, images and traces</text><rect x="454" y="565" width="292" height="84" rx="12" fill="#111827" stroke="#27354A"/><rect x="467" y="583" width="4" height="21" rx="2" fill="#34D399" stroke="#34D399"/><text x="483" y="600" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">Dashboard / Risk Map</text><text x="483" y="628" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="500">Select saved comparisons</text><rect x="42" y="415" width="292" height="84" rx="12" fill="#111827" stroke="#27354A"/><rect x="55" y="433" width="4" height="21" rx="2" fill="#34D399" stroke="#34D399"/><text x="71" y="450" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">CLI / workflow result</text><text x="71" y="478" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="500">Exit 0, 1 or 2</text><rect x="42" y="565" width="292" height="84" rx="12" fill="#111827" stroke="#27354A"/><rect x="55" y="583" width="4" height="21" rx="2" fill="#34D399" stroke="#34D399"/><text x="71" y="600" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">Release check</text><text x="71" y="628" fill="#9