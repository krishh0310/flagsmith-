<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="488" viewBox="0 0 1200 488" role="img" aria-labelledby="title desc">
<title id="title">Flag Rehearsal architecture</title>
<desc id="desc">The dashboard and CLI call the same engine. The SDK requests an evaluation for each identity. Browser results feed the comparison, evidence, CI and Risk Map. Explorer uses a temporary Flagsmith environment for interventions.</desc>
