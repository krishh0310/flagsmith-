<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Move discovery before release</title><desc id="desc">Without rehearsal a configuration is released before discovering a broken journey. With rehearsal the journey is exercised before release.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="context-stroke"/></marker></defs>
<rect x="1" y="1" width="1198" height="378" rx="18" fill="#0B1120" stroke="#27354A"/><text x="42" y="56" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="600">Move discovery before release</text><text x="42" y="91" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="500">A feature flag can change the customer journey without a new app deployment.</text><text x="42" y="139" fill="#F87171" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="600">Without Flag Rehearsal</text><rect x="42" y="155" width="192" height="76" rx="12" fill="#111827" stroke="#27354A"/><text x="57" y="186" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">Change flag</text><path d="M242 193h22" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="273" y="155" width="192" height="76" rx="12" fill="#111827" stroke="#27354A"/><text x="288" y="186" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">Release</text><text x="288" y="212" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">configuration</text><path d="M473 193h22" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="504" y="155" width="192" height="76" rx="12" fill="#111827" stroke="#27354A"/><text x="519" y="186" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">Checkout breaks</text><path d="M704 193h22" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="735" y="155" width="192" height="76" rx="12" fill="#111827" stroke="#27354A"/><text x="750" y="186" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">Find regression</text><path d="M935 193h22" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="966" y="155" width="192" height="76" rx="12" fill="#111827" stroke="#27354A"/><text x="981" y="186" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">Debug incident</text><text x="42" y="275" fill="#34D399" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="600">With Flag Rehearsal</text><rect x="42" y="290" width="192" height="76" rx="12" fill="#111827" stroke="#27354A"/><text x="57" y="321" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">Propose</text><text x="57" y="347" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">configuration</text><path d="M242 328h22" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="273" y="290" width="192" height="76" rx="12" fill="#111827" stroke="#27354A"/><text x="288" y="321" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">Rehearse</text><text x="288" y="347" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">journeys</text><path d="M473 328h22" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="504" y="290" width="192" height="76" rx="12" fill="#111827" stroke="#27354A"/><text x="519" y="321" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">Find regression</text><path d="M704 328h22" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="735" y="290" width="192" height="76" rx="12" fill="#111827" stroke="#27354A"/><text x="750" y="321" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">Inspect and fix</text><path d="M935 328h22" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="966" y="290" width="192" height="76" rx="12" fill="#111827" stroke="#27354A"/><text x="981" y="321" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">Release after</text><text x="981" y="347" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">checks pass</text>
</svg>
