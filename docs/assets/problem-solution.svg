<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="318" viewBox="0 0 1200 318" role="img" aria-labelledby="title desc">
<title id="title">Moving the check before release</title>
<desc id="desc">Two release paths place discovery on opposite sides of rollout.</desc>
<rect x="1" y="1" width="1198" height="316" rx="18" fill="#0B1120" stroke="#334155"/>
<text x="40" y="53" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="32" font-weight="650" fill="#F8FAFC">When does the team discover the failure?</text>
<text x="42" y="95" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#FDA4A4">Without Flag Rehearsal</text>
<rect x="40" y="112" width="247" height="57" rx="12" fill="#111827" stroke="#334155"/>
<text x="54" y="148" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="550" fill="#F8FAFC">Change flag</text>
<path d="M296 141H322m-7 -6 7 6-7 6" stroke="#EF4444" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="331" y="112" width="247" height="57" rx="12" fill="#111827" stroke="#334155"/>
<text x="345" y="148" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="550" fill="#F8FAFC">Release configuration</text>
<path d="M587 141H613m-7 -6 7 6-7 6" stroke="#EF4444" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="622" y="112" width="247" height="57" rx="12" fill="#111827" stroke="#334155"/>
<text x="636" y="148" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="550" fill="#F8FAFC">User journey breaks</text>
<path d="M878 141H904m-7 -6 7 6-7 6" stroke="#EF4444" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="913" y="112" width="247" height="57" rx="12" fill="#111827" stroke="#334155"/>
<text x="927" y="148" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="550" fill="#F8FAFC">Emergency debugging</text>
<text x="42" y="214" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#34D399">With Flag Rehearsal</text>
<rect x="40" y="231" width="247" height="57" rx="12" fill="#111827" stroke="#334155"/>
<text x="54" y="267" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="550" fill="#F8FAFC">Propose change</text>
<path d="M296 260H322m-7 -6 7 6-7 6" stroke="#34D399" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="331" y="231" width="247" height="57" rx="12" fill="#111827" stroke="#334155"/>
<text x="345" y="267" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="550" fill="#F8FAFC">Rehearse journeys</text>
<path d="M587 260H613m-7 -6 7 6-7 6" stroke="#34D399" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="622" y="231" width="247" height="57" rx="12" fill="#111827" stroke="#334155"/>
<text x="636" y="267" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="550" fill="#F8FAFC">Detect and fix regression</text>
<path d="M878 260H904m-7 -6 7 6-7 6" stroke="#34D399" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="913" y="231" width="247" height="57" rx="12" fill="#111827" stroke="#334155"/>
<text x="927" y="267" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="550" fill="#F8FAFC">Release validated config</text>
</svg>
