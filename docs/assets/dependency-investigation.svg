<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="335" viewBox="0 0 1200 335" role="img" aria-labelledby="title desc">
<title id="title">Single-flag interventions</title>
<desc id="desc">Each card changes one flag from the reproduced three-flag failure for team. The tested recoveries support a scoped dependency hypothesis.</desc>
<rect x="1" y="1" width="1198" height="333" rx="18" fill="#0B1120" stroke="#334155"/>
<text x="40" y="55" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="32" font-weight="650" fill="#F8FAFC">What lets the team finish onboarding?</text>
<text x="42" y="100" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="650" fill="#FDA4A4">Reproduced failure</text>
<text x="269" y="100" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" font-weight="550" fill="#F8FAFC">New flow on   /   Saving off   /   Tips off</text>
<path d="M40 127H1158" stroke="#334155" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="150" width="355" height="110" rx="12" fill="#111827" stroke="#334155"/>
<text x="56" y="184" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="550" fill="#F8FAFC">Enable saving</text>
<circle cx="61" cy="222" r="4" fill="#34D399"/>
<text x="78" y="230" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" font-weight="550" fill="#F8FAFC">Pass</text>
<text x="135" y="229" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="550" fill="#94A3B8">The new flow completes.</text>
<rect x="420" y="150" width="355" height="110" rx="12" fill="#111827" stroke="#334155"/>
<text x="436" y="184" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="550" fill="#F8FAFC">Use Classic</text>
<circle cx="441" cy="222" r="4" fill="#34D399"/>
<text x="458" y="230" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" font-weight="550" fill="#F8FAFC">Pass</text>
<text x="515" y="229" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="550" fill="#94A3B8">The Classic flow completes.</text>
<rect x="800" y="150" width="355" height="110" rx="12" fill="#111827" stroke="#334155"/>
<text x="816" y="184" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="550" fill="#F8FAFC">Enable tips</text>
<circle cx="821" cy="222" r="4" fill="#EF4444"/>
<text x="838" y="230" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" font-weight="550" fill="#F8FAFC">Fail</text>
<text x="895" y="229" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="550" fill="#94A3B8">The new flow still blocks.</text>
<text x="42" y="305" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="550" fill="#C4B5FD">Inference</text>
<text x="161" y="305" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="550" fill="#F8FAFC">Saving is required for the tested new-flow journey on this profile.</text>
</svg>
