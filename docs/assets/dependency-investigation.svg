<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Investigating the Onboarding regression</title><desc id="desc">Original New flow On and Saving Off fails and repeats. Turning Saving On alone recovers. Turning New flow Off alone also recovers. Enabling Tips alone still fails.</desc>
