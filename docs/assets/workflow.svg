<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="258" viewBox="0 0 1200 258" role="img" aria-labelledby="title desc">
<title id="title">Rehearse, investigate, validate</title>
<desc id="desc">Compare synthetic journeys, inspect browser evidence, then repeat the same check after changing Flagsmith.</desc>
<rect x="1" y="1" width="1198" height="256" rx="18" fill="#0B1120" stroke="#334155"/>
<text x="40" y="55" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="32" font-weight="650" fill="#F8FAFC">From a proposed change to a release decision</text>
<rect x="40" y="90" width="345" height="125" rx="12" fill="#111827" stroke="#334155"/>
<text x="56" y="128" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="550" fill="#34D399">Rehearse</text>
<text x="56" y="166" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#F8FAFC">Replay the journey for each profile</text>
<text x="56" y="193" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#F8FAFC">in Current and Proposed.</text>
<path d="M391 152H417m-7 -6 7 6-7 6" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="425" y="90" width="345" height="125" rx="12" fill="#111827" stroke="#334155"/>
<text x="441" y="128" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="550" fill="#C4B5FD">Investigate</text>
<text x="441" y="166" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#F8FAFC">Inspect a failed step and its trace.</text>
<text x="441" y="193" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#F8FAFC">Explore flag combinations separately.</text>
<path d="M776 152H802m-7 -6 7 6-7 6" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="810" y="90" width="345" height="125" rx="12" fill="#111827" stroke="#334155"/>
<text x="826" y="128" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="550" fill="#34D399">Validate</text>
<text x="826" y="166" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#F8FAFC">Rerun after the change. Read the</text>
<text x="826" y="193" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#F8FAFC">exit status or inspect the Risk Map.</text>
</svg>
