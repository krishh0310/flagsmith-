if" font-size="19" font-weight="600">with the SDK</text><path d="M704 167h22" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="735" y="129" width="192" height="76" rx="12" fill="#111827" stroke="#27354A"/><text x="750" y="160" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">Replay the</text><text x="750" y="186" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">browser journey</text><path d="M935 167h22" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="966" y="129" width="192" height="76" rx="12" fill="#111827" stroke="#27354A"/><text x="981" y="160" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">Compare Current</text><text x="981" y="186" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600">and Proposed</text><path d="M1064 205v46" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="932" y="258" width="226" height="84" rx="12" fill="#111827" stroke="#27354A"/><rect x="945" y="276" width="4" height="21" rx="2" fill="#34D399" stroke="#34D399"/><text x="961" y="293" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">Save evidence</text><text x="961" y="321" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="500">Reports and traces</text><path d="M932 300H873" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="598" y="258" widt