<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="382" viewBox="0 0 1200 382" role="img" aria-labelledby="title desc">
<title id="title">From candidate configuration to release evidence</title><desc id="desc">Configure environments, register inputs, resolve flags, run browsers, compare, retain evidence, investigate and return a result.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="context-stroke"/></marker></defs>
