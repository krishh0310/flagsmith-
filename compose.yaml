name: flag-rehearsal

x-flagsmith: &flagsmith
  image: flagsmith/flagsmith:2.295.2
  environment:
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/flagsmith
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    FLAGSMITH_DOMAIN: localhost:${FLAGSMITH_PORT:-8000}
    ENVIRONMENT: production
    USE_POSTGRES_FOR_ANALYTICS: "true"
    ENABLE_TELEMETRY: "false"

services:
  postgres:
    image: postgres:15.18-alpine
    environment:
      POSTGRES_DB: flagsmith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -d, flagsmith, -U, postgres]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate-db:
    <<: *flagsmith
    command: migrate
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    <<: *flagsmith
    command: serve
    ports:
      - "127.0.0.1:${FLAGSMITH_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, flagsmith, healthcheck, http]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s
    depends_on:
      migrate-db:
        condition: service_completed_successfully

volumes:
  pgdata:
